title: "shadowLee - 语音按钮网站"
description: "点击按钮播放语音"
url: "https://carlosdjy.github.io"
baseurl: "/shadowlee-page"

# 构建设置
markdown: kramdown
permalink: pretty
# 不使用 minima 主题，使用完全自定义样式
# theme: minima
# minima:
#   skin: classic

# 插件
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# 排除文件
exclude:
  - .jekyll-cache
  - _site
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md
  - _posts
  - worker

# 包含文件
include:
  - assets
  - _layouts